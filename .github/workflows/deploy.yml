name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flyright-web/package-lock.json

      - name: Install dependencies
        working-directory: flyright-web
        run: npm ci

      - name: Build web application
        working-directory: flyright-web
        run: npm run build

      - name: Sync Capacitor iOS assets
        working-directory: flyright-web
        run: npx cap copy ios

      - name: Install CocoaPods with CDN Repo Update
        working-directory: flyright-web/ios/App
        run: pod install --repo-update

      - name: Set up App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Import Apple Distribution Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=flyright-web/ios/App/FlyRight_App_Store.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$CERTIFICATE_PATH"

          security create-keychain -p "temp_keychain_pass" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp_keychain_pass" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp_keychain_pass" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          python3 -c '
          import re, plistlib, sys
          data = open(sys.argv[1], "rb").read()
          m = re.search(b"<\\?xml.*?</plist>", data, re.S)
          pl = plistlib.loads(m.group(0))
          print("PROFILE_UUID=" + pl["UUID"])
          print("PROFILE_NAME=" + pl["Name"])
          ' "$PP_PATH" >> $GITHUB_ENV

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(python3 -c '
          import re, plistlib, sys
          data = open(sys.argv[1], "rb").read()
          m = re.search(b"<\\?xml.*?</plist>", data, re.S)
          print(plistlib.loads(m.group(0))["UUID"])
          ' "$PP_PATH")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "Installed UUID: $UUID"

      - name: Build, Export, and Upload to TestFlight
        working-directory: flyright-web/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: "3J5H7Y862Q"
          BUNDLE_ID: "com.flyrightcopilot.flyrightcopilot"
        run: |
          set -e
          echo "Using Profile Name: '$PROFILE_NAME' ($PROFILE_UUID)"

          # 1. Ensure the Bundle Identifier matches App Store Connect exactly
          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" App/Info.plist || true

          # 2. Build signed Xcode archive using the exact installed profile UUID
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/App.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            archive

          # 3. Create ExportOptions.plist using the exact Profile Name read from the file
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 4. Export signed .ipa locally
          xcodebuild -exportArchive \
            -archivePath "build/App.xcarchive" \
            -exportPath "build/export" \
            -exportOptionsPlist exportOptions.plist

          # 5. Locate the exported .ipa and upload to TestFlight via App Store Connect API Key
          IPA_PATH=$(find build/export -name "*.ipa" | head -n 1)
          echo "Uploading IPA: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

