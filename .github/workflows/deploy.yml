name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: flyright-web/package-lock.json

      - name: Install dependencies
        working-directory: flyright-web
        run: npm ci

      - name: Build web application
        working-directory: flyright-web
        run: npm run build

      - name: Sync Capacitor iOS Assets
        working-directory: flyright-web
        run: npx cap copy ios

      - name: Install Pods with CDN Repo Update
        working-directory: flyright-web/ios/App
        run: pod install --repo-update

      - name: Set up Apple App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Build iOS Archive and Upload to TestFlight
        working-directory: flyright-web/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # 1. Update Info.plist and project bundle identifier to match App Store Connect
          plutil -replace CFBundleIdentifier -string "com.flyrightcopilot.flyrightcopilot" App/Info.plist || true

          # 2. Archive workspace with iOS 15 deployment target and explicit bundle ID
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -destination "generic/platform=iOS" \
            -archivePath "build/App.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="com.flyrightcopilot.flyrightcopilot" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            archive \
            CODE_SIGNING_ALLOWED=NO

          # 3. Package into IPA container
          mkdir -p build/export/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/export/Payload/
          cd build/export
          zip -qr App.ipa Payload

          # 4. Upload directly to TestFlight using exact Apple ID and Bundle ID
          xcrun altool --upload-app \
            --type ios \
            --file App.ipa \
            --apple-id "6832358757" \
            --bundle-id "com.flyrightcopilot.flyrightcopilot" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
