name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: flyright-web/package-lock.json

      - name: Install dependencies
        working-directory: flyright-web
        run: npm ci

      - name: Build web application
        working-directory: flyright-web
        run: npm run build

      - name: Sync Capacitor iOS Assets
        working-directory: flyright-web
        run: npx cap copy ios

      - name: Install Pods with CDN Repo Update
        working-directory: flyright-web/ios/App
        run: pod install --repo-update

      - name: Set up Apple App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Build iOS Archive, Sign, and Upload to TestFlight
        working-directory: flyright-web/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # 1. Align Info.plist Bundle Identifier
          plutil -replace CFBundleIdentifier -string "com.flyrightcopilot.flyrightcopilot" App/Info.plist || true

          # 2. Build the Xcode Archive
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -destination "generic/platform=iOS" \
            -archivePath "build/App.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="com.flyrightcopilot.flyrightcopilot" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            archive \
            CODE_SIGNING_ALLOWED=NO

          # 3. Create Export Options Plist
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>2B6P9Y533J</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 4. Export the archive with automatic provisioning to inject embedded.mobileprovision
          xcodebuild -exportArchive \
            -archivePath "build/App.xcarchive" \
            -exportPath "build/export" \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          # 5. Locate the exported IPA and upload to TestFlight
          IPA_PATH=\$(find build/export -name "*.ipa" | head -n 1)
          echo "Found IPA at: \$IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "\$IPA_PATH" \
            --apple-id "6832358757" \
            --bundle-id "com.flyrightcopilot.flyrightcopilot" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
