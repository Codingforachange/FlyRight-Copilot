name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: flyright-web/package-lock.json

      - name: Install dependencies
        working-directory: flyright-web
        run: npm ci

      - name: Build web application
        working-directory: flyright-web
        run: npm run build

      - name: Sync Capacitor iOS Assets
        working-directory: flyright-web
        run: npx cap copy ios

      - name: Install Pods with CDN Repo Update
        working-directory: flyright-web/ios/App
        run: pod install --repo-update

      - name: Set up Apple App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Build, Code Sign, and Upload to TestFlight
        working-directory: flyright-web/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # 1. Update project and Info.plist bundle identifier
          plutil -replace CFBundleIdentifier -string "com.flyrightcopilot.flyrightcopilot" App/Info.plist || true

          # 2. Create the App Store Connect API JSON configuration for Fastlane
          cat <<EOF > fastlane_api_key.json
          {
            "key_id": "$KEY_ID",
            "issuer_id": "$ISSUER_ID",
            "key_filepath": "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8",
            "in_house": false
          }
          EOF

          # 3. Create a temporary keychain to hold the certificate
          security create-keychain -p "" build.keychain
          security list-keychains -s build.keychain $(security list-keychains | tr -d '"')
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 3600 build.keychain

          # 4. Fetch/Generate Apple Distribution Certificate & Provisioning Profile
          fastlane cert --api_key_path fastlane_api_key.json --keychain_path build.keychain --keychain_password ""
          fastlane sigh --api_key_path fastlane_api_key.json -a "com.flyrightcopilot.flyrightcopilot" --skip_install false

          # 5. Build, sign, and package the IPA using gym
          fastlane gym \
            --workspace App.xcworkspace \
            --scheme App \
            --clean \
            --output_directory "build/export" \
            --output_name "App.ipa" \
            --export_method "app-store" \
            --xcargs "PRODUCT_BUNDLE_IDENTIFIER=com.flyrightcopilot.flyrightcopilot IPHONEOS_DEPLOYMENT_TARGET=15.0"

          # 6. Upload directly to TestFlight using pilot
          fastlane pilot upload \
            --api_key_path fastlane_api_key.json \
            --ipa "build/export/App.ipa" \
            --apple_id "6832358757" \
            --app_identifier "com.flyrightcopilot.flyrightcopilot" \
            --skip_waiting_for_build_processing true
