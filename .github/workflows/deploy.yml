name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: flyright-web/package-lock.json

      - name: Install dependencies
        working-directory: flyright-web
        run: npm ci

      - name: Build web application
        working-directory: flyright-web
        run: npm run build

      - name: Sync Capacitor iOS Assets
        working-directory: flyright-web
        run: npx cap copy ios

      - name: Install Pods with CDN Repo Update
        working-directory: flyright-web/ios/App
        run: pod install --repo-update

      - name: Build, Sign, and Upload to TestFlight
        working-directory: flyright-web/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: "2B6P9Y533J"
          BUNDLE_ID: "com.flyrightcopilot.flyrightcopilot"
          APPLE_ID: "6832358757"
        run: |
          set -e

          # 1. Align Info.plist Bundle Identifier
          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" App/Info.plist || true

          # 2. Setup API Key file
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          # 3. Create a Fastlane Fastfile with explicit team settings
          mkdir -p fastlane
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Build, sign, and upload to TestFlight"
            lane :release do
              api_key = app_store_connect_api_key(
                key_id: ENV["KEY_ID"],
                issuer_id: ENV["ISSUER_ID"],
                key_filepath: File.expand_path("~/.appstoreconnect/private_keys/AuthKey_#{ENV['KEY_ID']}.p8"),
                in_house: false
              )

              # Create and configure temporary keychain
              create_keychain(
                name: "ci_keychain",
                password: "build_password_123",
                default_keychain: true,
                unlock: true,
                timeout: 3600,
                lock_when_sleeps: false
              )

              # Fetch or generate Distribution Certificate
              get_certificates(
                api_key: api_key,
                keychain_name: "ci_keychain",
                keychain_password: "build_password_123"
              )

              # Fetch or generate App Store Provisioning Profile
              get_provisioning_profile(
                api_key: api_key,
                app_identifier: ENV["BUNDLE_ID"],
                force: true
              )

              # Build and package the signed IPA
              build_app(
                workspace: "App.xcworkspace",
                scheme: "App",
                clean: true,
                export_method: "app-store",
                export_options: {
                  signingStyle: "manual",
                  teamID: ENV["TEAM_ID"],
                  uploadSymbols: true
                },
                xcargs: "PRODUCT_BUNDLE_IDENTIFIER=#{ENV['BUNDLE_ID']} IPHONEOS_DEPLOYMENT_TARGET=15.0"
              )

              # Upload directly to TestFlight
              upload_to_testflight(
                api_key: api_key,
                app_identifier: ENV["BUNDLE_ID"],
                apple_id: ENV["APPLE_ID"],
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

          # 4. Execute the Fastlane release lane
          bundle exec fastlane release || fastlane release
