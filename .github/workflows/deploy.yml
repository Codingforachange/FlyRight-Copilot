name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flyright-web/package-lock.json

      - name: Install dependencies
        working-directory: flyright-web
        run: npm ci

      - name: Build web application
        working-directory: flyright-web
        run: npm run build

      - name: Sync Capacitor iOS assets
        working-directory: flyright-web
        run: npx cap copy ios

      - name: Install CocoaPods with CDN Repo Update
        working-directory: flyright-web/ios/App
        run: pod install --repo-update

      - name: Set up App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Import Apple Distribution Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=flyright-web/ios/App/FlyRight_App_Store.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$CERTIFICATE_PATH"

          security create-keychain -p "temp_keychain_pass" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp_keychain_pass" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp_keychain_pass" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          python3 -c '
          import re, plistlib, sys
          data = open(sys.argv[1], "rb").read()
          m = re.search(b"<\\?xml.*?</plist>", data, re.S)
          pl = plistlib.loads(m.group(0))
          print("PROFILE_UUID=" + pl["UUID"])
          print("PROFILE_NAME=" + pl["Name"])
          ' "$PP_PATH" >> $GITHUB_ENV

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(python3 -c '
          import re, plistlib, sys
          data = open(sys.argv[1], "rb").read()
          m = re.search(b"<\\?xml.*?</plist>", data, re.S)
          print(plistlib.loads(m.group(0))["UUID"])
          ' "$PP_PATH")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "Installed UUID: $UUID"

      - name: Build, Export, and Upload to TestFlight
        working-directory: flyright-web/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: "3J5H7Y862Q"
          BUNDLE_ID: "com.flyrightcopilot.flyrightcopilot"
        run: |
          set -e
          echo "Using Profile Name: '$PROFILE_NAME' ($PROFILE_UUID)"

          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" App/Info.plist || true

          # Configure manual signing ONLY on the App target (never on Pods)
          python3 -c '
          import re, os
          p = "App.xcodeproj/project.pbxproj"
          txt = open(p).read()
          team = os.environ["TEAM_ID"]
          bundle = os.environ["BUNDLE_ID"]
          prof_uuid = os.environ["PROFILE_UUID"]
          prof_name = os.environ["PROFILE_NAME"]

          txt = re.sub(r"CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;", txt)
          txt = re.sub(r"DEVELOPMENT_TEAM = [^;]*;", f"DEVELOPMENT_TEAM = {team};", txt)
          txt = re.sub(r"PRODUCT_BUNDLE_IDENTIFIER = [^;]*;", f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};", txt)

          def inject_signing(m):
              block = m.group(0)
              if "INFOPLIST_FILE = App/Info.plist;" in block:
                  block = re.sub(r"CODE_SIGN_IDENTITY = [^;]*;\n?", "", block)
                  block = re.sub(r"\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = [^;]*;\n?", "", block)
                  block = re.sub(r"PROVISIONING_PROFILE = [^;]*;\n?", "", block)
                  block = re.sub(r"PROVISIONING_PROFILE_SPECIFIER = [^;]*;\n?", "", block)
                  add = (
                      f"\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n"
                      f"\t\t\t\t\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";\n"
                      f"\t\t\t\tPROVISIONING_PROFILE = \"{prof_uuid}\";\n"
                      f"\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"{prof_name}\";\n"
                  )
                  block = block.replace("INFOPLIST_FILE = App/Info.plist;", "INFOPLIST_FILE = App/Info.plist;\n" + add)
              return block

          txt = re.sub(r"buildSettings = \{[^}]*\};", inject_signing, txt, flags=re.S)
          open(p, "w").write(txt)
          '

          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/App.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            archive

          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "build/App.xcarchive" \
            -exportPath "build/export" \
            -exportOptionsPlist exportOptions.plist

          IPA_PATH=$(find build/export -name "*.ipa" | head -n 1)
          echo "Uploading IPA: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
